name: Deploy to Production

on:
  push:
    branches:
      - dev
      - test/auto-deploy

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/tactix/api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/tactix/frontend

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & Test affected projects
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint affected
        run: npx nx affected -t lint --base=origin/dev~1 --head=HEAD

      - name: Test affected
        run: npx nx affected -t test --base=origin/dev~1 --head=HEAD --passWithNoTests

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Build Docker images and push to GHCR
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get short SHA
        id: sha
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.sha.outputs.tag }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/frontend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.sha.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy to VPS via SSH
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          request_pty: true
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_PATH="$(printf '%s' '${{ vars.VPS_DEPLOY_PATH }}' | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            echo "Remote host: $(hostname)"
            echo "Remote user: $(whoami)"
            echo "Remote shell: ${SHELL:-unknown}"
            echo "Remote pwd: $(pwd)"
            echo "Deploy path: <${DEPLOY_PATH}>"
            echo "Filesystem probe:"
            ls -ld /project || true
            ls -ld /project/tactix || true
            ls -ld "$HOME/project" || true
            ls -ld "$HOME/project/tactix" || true
            ls -ld "$DEPLOY_PATH" || true

            if [ -z "$DEPLOY_PATH" ]; then
              echo "VPS_DEPLOY_PATH is empty."
              exit 1
            fi

            if [ ! -d "$DEPLOY_PATH" ]; then
              if [ -d "$HOME${DEPLOY_PATH}" ]; then
                echo "Deploy path does not exist on VPS: $DEPLOY_PATH"
                echo "But this path exists under the SSH user's home: $HOME${DEPLOY_PATH}"
                echo "Set VPS_DEPLOY_PATH to $HOME${DEPLOY_PATH} instead."
                exit 1
              fi

              echo "Deploy path does not exist on VPS: $DEPLOY_PATH"
              echo "Clone the repository on the VPS first, then point VPS_DEPLOY_PATH at that repo root."
              exit 1
            fi

            cd "$DEPLOY_PATH"

            if [ ! -d .git ]; then
              echo "Deploy path is not a git repository: $DEPLOY_PATH"
              exit 1
            fi

            if [ ! -f apps/api/scripts/deploy.sh ]; then
              echo "Missing deploy script at apps/api/scripts/deploy.sh inside $DEPLOY_PATH"
              exit 1
            fi

            git pull --ff-only origin '${{ github.ref_name }}'
            chmod +x apps/api/scripts/deploy.sh
            GITHUB_OWNER='${{ github.repository_owner }}' \
            GITHUB_REPO='tactix' \
            IMAGE_TAG='${{ needs.build-and-push.outputs.image_tag }}' \
            bash apps/api/scripts/deploy.sh
