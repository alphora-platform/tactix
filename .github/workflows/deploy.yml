name: Deploy to Production

on:
  push:
    branches:
      - dev

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/tactix/api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/tactix/frontend

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & Test affected projects
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint affected
        run: npx nx affected -t lint --base=origin/dev~1 --head=HEAD

      - name: Test affected
        run: npx nx affected -t test --base=origin/dev~1 --head=HEAD --passWithNoTests

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Build Docker images and push to GHCR
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get short SHA
        id: sha
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.sha.outputs.tag }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.sha.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy to VPS via SSH
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          script: |
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git pull origin dev
            chmod +x apps/api/scripts/deploy.sh
            GITHUB_OWNER=${{ github.repository_owner }} \
            GITHUB_REPO=tactix \
            IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }} \
            bash apps/api/scripts/deploy.sh
