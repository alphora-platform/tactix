<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TACTIX — TFT Meta Analytics</title>
    <meta
      name="description"
      content="Tactix: TFT meta analytics platform with tier lists, comp trends, regional comparisons and personal performance tracking."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0f14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@600;700&display=swap"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Theme init: sync dark class before React mounts to prevent flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tactix-theme');
          var parsed = stored ? JSON.parse(stored) : null;
          var mode = parsed && parsed.state && parsed.state.theme ? parsed.state.theme : 'dark';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // If localStorage is unavailable or JSON is corrupt, default to dark
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
