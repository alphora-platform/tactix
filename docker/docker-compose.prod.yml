name: tactix-prod

services:
  # ─── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tactix-postgres
    restart: unless-stopped
    env_file:
      - ../.env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432' # Host nginx proxies /db/ → localhost:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tactix}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tactix-internal

  # ─── Cache / Queue ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tactix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - tactix-internal

  # ─── NestJS API ────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/${GITHUB_OWNER}/${GITHUB_REPO}/api:${IMAGE_TAG:-latest}
    container_name: tactix-api
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      APP_MODE: api
      NODE_ENV: production
    ports:
      - '127.0.0.1:5500:5500' # Host nginx proxies /api/ → localhost:5500
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://localhost:5500/api/health'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - tactix-internal

  # ─── BullMQ Worker ─────────────────────────────────────────────────────────
  worker:
    image: ghcr.io/${GITHUB_OWNER}/${GITHUB_REPO}/api:${IMAGE_TAG:-latest}
    container_name: tactix-worker
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      APP_MODE: worker
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tactix-internal

  # ─── React Frontend (nginx SPA) ────────────────────────────────────────────
  frontend:
    image: ghcr.io/${GITHUB_OWNER}/${GITHUB_REPO}/frontend:${IMAGE_TAG:-latest}
    container_name: tactix-frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:80' # Host nginx proxies / → localhost:3000
    depends_on:
      - api
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tactix-internal

networks:
  tactix-internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
