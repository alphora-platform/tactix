services:
  postgres:
    image: postgres:16-alpine
    container_name: tactix-postgres
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
